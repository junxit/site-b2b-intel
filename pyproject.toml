[project]
name = "site-b2b-intel"
version = "0.1.0"
description = "DNS-based B2B vendor intelligence — identify the SaaS vendors a company uses from its public DNS records."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jade Naaman", email = "56563426+junxit@users.noreply.github.com" },
]
dependencies = [
    "dnspython>=2.6",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tldextract>=5.1",
]

[project.scripts]
b2b-intel = "site_b2b_intel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_b2b_intel"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
