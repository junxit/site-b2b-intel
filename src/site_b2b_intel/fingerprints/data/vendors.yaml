# Vendor catalog. Each entry has a stable `slug`, a display `name`, a
# `category`, and an optional `profile` block.
# Edit and run `b2b-intel reseed` to push changes into the DB.
#
# PROFILE DATA POLICY
# -------------------
# The shipped seed carries only `website` (stable and trivially verifiable)
# and, where it is a settled fact, `headquarters`. Support/sales mailboxes
# and phone numbers are deliberately NOT shipped: most vendors route support
# through authenticated ticket portals rather than public mailboxes, and any
# number bundled here would rot silently and be wrong in a way users could
# not detect.
#
# The `vendor_profile` table still carries support_email / sales_email /
# phone columns, and they are versioned over time — populate them from your
# own verified sources via the DB, not from this file.
#
# `source: unverified` marks every profile below as best-effort reference
# data, not human-verified fact.

